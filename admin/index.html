<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Riviera Transfers - Admin</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f4f4f4;
        }

        h1 {
            margin-bottom: 25px;
        }

        #bookings {
            display: grid;
            gap: 20px;
        }

        .booking-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .booking-card h2 {
            margin-top: 0;
        }

        .booking-card p {
            margin: 8px 0;
        }

        .booking-actions {
            margin-top: 20px;
        }

        button {
            padding: 10px 15px;
            margin-right: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        .status {
            font-weight: bold;
        }

    </style>

</head>


<body>

    <h1>Riviera Transfers — Bookings</h1>

    <div id="bookings">
        Loading bookings...
    </div>


    <script>

        console.log("ADMIN PAGE SCRIPT STARTED");


        /* =========================================
           LOAD BOOKINGS
        ========================================= */

        async function loadBookings() {

            const container =
                document.getElementById("bookings");


            try {

                const response =
                    await fetch("/api/bookings");


                console.log(
                    "API status:",
                    response.status
                );


                const data =
                    await response.json();


                console.log(
                    "API data:",
                    data
                );


                if (!data.success) {

                    container.innerHTML =
                        "<p>Unable to load bookings.</p>";

                    return;
                }


                if (
                    !data.bookings ||
                    data.bookings.length === 0
                ) {

                    container.innerHTML =
                        "<p>No bookings found.</p>";

                    return;
                }


                displayBookings(data.bookings);


            } catch (error) {

                console.error(
                    "Load bookings error:",
                    error
                );


                container.innerHTML =
                    "<p>Error loading bookings.</p>";

            }

        }


        /* =========================================
           DISPLAY BOOKINGS
        ========================================= */

        function displayBookings(bookings) {

            const container =
                document.getElementById("bookings");


            container.innerHTML = "";


            bookings.forEach(function(booking) {

                const card =
                    document.createElement("div");


                card.className =
                    "booking-card";


                card.innerHTML = `

                    <h2>
                        ${booking.name}
                    </h2>

                    <p>
                        <strong>Phone:</strong>
                        ${booking.phone}
                    </p>

                    <p>
                        <strong>Pickup:</strong>
                        ${booking.pickup}
                    </p>

                    <p>
                        <strong>Drop-off:</strong>
                        ${booking.dropoff}
                    </p>

                    <p>
                        <strong>Date:</strong>
                        ${booking.date}
                    </p>

                    <p>
                        <strong>Time:</strong>
                        ${booking.time}
                    </p>

                    <p>
                        <strong>Passengers:</strong>
                        ${booking.passengers}
                    </p>

                    <p>
                        <strong>Vehicle:</strong>
                        ${booking.vehicle}
                    </p>

                    <p class="status">
                        <strong>Status:</strong>
                        ${booking.status}
                    </p>

                    <div class="booking-actions">

                        <button
                            onclick="updateStatus(
                                '${booking._id}',
                                'confirmed'
                            )"
                        >
                            Confirm
                        </button>


                        <button
                            onclick="updateStatus(
                                '${booking._id}',
                                'completed'
                            )"
                        >
                            Complete
                        </button>


                        <button
                            onclick="updateStatus(
                                '${booking._id}',
                                'cancelled'
                            )"
                        >
                            Cancel
                        </button>


                        <button
                            onclick="deleteBooking(
                                '${booking._id}'
                            )"
                        >
                            Delete
                        </button>

                    </div>

                    <hr>

                `;


                container.appendChild(card);

            });

        }


        /* =========================================
           UPDATE BOOKING STATUS
        ========================================= */

        async function updateStatus(
            bookingId,
            status
        ) {

            console.log(
                "Updating booking:",
                bookingId,
                status
            );


            try {

                const response =
                    await fetch(
                        "/api/bookings/" +
                        bookingId +
                        "/status",
                        {
                            method: "PATCH",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                status: status
                            })
                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "Status response:",
                    data
                );


                if (!data.success) {

                    alert(
                        data.message ||
                        "Unable to update booking status."
                    );

                    return;
                }


                alert(
                    "Booking status updated to: " +
                    status
                );


                loadBookings();


            } catch (error) {

                console.error(
                    "Status update error:",
                    error
                );


                alert(
                    "Unable to update booking status."
                );

            }

        }


        /* =========================================
           DELETE BOOKING
        ========================================= */

        async function deleteBooking(
            bookingId
        ) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this booking?"
                );


            if (!confirmed) {

                return;

            }


            console.log(
                "Deleting booking:",
                bookingId
            );


            try {

                const response =
                    await fetch(
                        "/api/bookings/" +
                        bookingId,
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "Delete response:",
                    data
                );


                if (!data.success) {

                    alert(
                        data.message ||
                        "Unable to delete booking."
                    );

                    return;
                }


                alert(
                    "Booking deleted successfully."
                );


                loadBookings();


            } catch (error) {

                console.error(
                    "Delete booking error:",
                    error
                );


                alert(
                    "Unable to delete booking."
                );

            }

        }


        /* =========================================
           START
        ========================================= */

        loadBookings();

    </script>

</body>

</html>
