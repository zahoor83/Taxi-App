<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Riviera Transfers - Admin</title>


    <style>

        /* =========================================
           GLOBAL
        ========================================= */

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f7fa;
            color: #222;
        }


        /* =========================================
           HEADER
        ========================================= */

        .admin-header {
            background: #111827;
            color: white;
            padding: 25px 30px;
        }

        .admin-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .admin-header p {
            margin: 8px 0 0;
            color: #cbd5e1;
        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .admin-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }


        /* =========================================
           PAGE TITLE
        ========================================= */

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            margin: 0;
            font-size: 24px;
        }

        .page-title p {
            margin-top: 6px;
            color: #666;
        }


        /* =========================================
           DASHBOARD STATISTICS
        ========================================= */

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .stat-card h3 {
            margin: 0 0 10px;
            font-size: 14px;
            color: #6b7280;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
        }


        /* =========================================
           BOOKINGS
        ========================================= */

        #bookings {
            display: grid;
            gap: 20px;
        }


        /* =========================================
   BOOKING CARDS
========================================= */

#bookings {
    display: grid;
    gap: 20px;
}

.booking-card {
    padding: 25px;
    border-radius: 14px;
    border: 2px solid #e5e7eb;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    transition: 0.2s ease;
}

/* =========================================
   PENDING - YELLOW
========================================= */

.booking-card.status-pending {
    background: #fff7d6 !important;
    border: 2px solid #f59e0b !important;
    border-left: 8px solid #f59e0b !important;
}

/* =========================================
   CONFIRMED - GREEN
========================================= */

.booking-card.status-confirmed {
    background: #dcfce7 !important;
    border: 2px solid #22c55e !important;
    border-left: 8px solid #22c55e !important;
}

/* =========================================
   COMPLETED - BLUE
========================================= */

.booking-card.status-completed {
    background: #dbeafe !important;
    border: 2px solid #3b82f6 !important;
    border-left: 8px solid #3b82f6 !important;
}

/* =========================================
   CANCELLED - RED
========================================= */

.booking-card.status-cancelled {
    background: #fee2e2 !important;
    border: 2px solid #ef4444 !important;
    border-left: 8px solid #ef4444 !important;
}


/* =========================================
   BOOKING TEXT
========================================= */

.booking-card h2 {
    margin-top: 0;
    margin-bottom: 18px;
    color: #111827;
}

.booking-card p {
    margin: 9px 0;
    color: #374151;
}


/* =========================================
   STATUS BADGE
========================================= */

.status {
    margin-top: 15px;
}

.status-badge {
    display: inline-block;
    margin-left: 8px;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
}


/* Pending badge */

.status-badge.status-pending {
    background: #f59e0b;
    color: white;
}


/* Confirmed badge */

.status-badge.status-confirmed {
    background: #22c55e;
    color: white;
}


/* Completed badge */

.status-badge.status-completed {
    background: #3b82f6;
    color: white;
}


/* Cancelled badge */

.status-badge.status-cancelled {
    background: #ef4444;
    color: white;
}


        /* =========================================
           PENDING CARD
        ========================================= */

        .booking-card.status-pending {
            background: #fffbeb;
            border-left-color: #f59e0b;
        }


        /* =========================================
           CONFIRMED CARD
        ========================================= */

        .booking-card.status-confirmed {
            background: #f0fdf4;
            border-left-color: #22c55e;
        }


        /* =========================================
           COMPLETED CARD
        ========================================= */

        .booking-card.status-completed {
            background: #eff6ff;
            border-left-color: #3b82f6;
        }


        /* =========================================
           CANCELLED CARD
        ========================================= */

        .booking-card.status-cancelled {
            background: #fef2f2;
            border-left-color: #ef4444;
        }


        /* =========================================
           STATUS
        ========================================= */

        .status {
            margin-top: 15px;
            font-weight: bold;
        }

        .status-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }


        /* Pending */

        .status-badge.status-pending {
            background: #fef3c7;
            color: #92400e;
        }


        /* Confirmed */

        .status-badge.status-confirmed {
            background: #dcfce7;
            color: #166534;
        }


        /* Completed */

        .status-badge.status-completed {
            background: #dbeafe;
            color: #1e40af;
        }


        /* Cancelled */

        .status-badge.status-cancelled {
            background: #fee2e2;
            color: #991b1b;
        }


        /* =========================================
           BUTTONS
        ========================================= */

        .booking-actions {
            margin-top: 22px;
        }

        button {
            padding: 10px 16px;
            margin-right: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #111827;
            color: white;
            font-weight: bold;
            transition: 0.2s ease;
        }

        button:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }


        /* =========================================
           HR
        ========================================= */

        hr {
            margin-top: 25px;
            border: 0;
            border-top: 1px solid #e5e7eb;
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 900px) {

            .dashboard-stats {
                grid-template-columns: repeat(3, 1fr);
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .admin-header {
                padding: 20px;
            }

            .admin-header h1 {
                font-size: 22px;
            }

            .admin-container {
                margin: 20px auto;
                padding: 0 15px;
            }

            .dashboard-stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-number {
                font-size: 24px;
            }

            .booking-card {
                padding: 18px;
            }

            button {
                width: 100%;
                margin-right: 0;
            }

        }
        
        /* =========================================
   DASHBOARD STAT CARD COLORS
========================================= */

/* Total Bookings */
.stat-card:has(#totalBookings) {
    background: #e0f2fe !important;
    border: 2px solid #0284c7 !important;
}

/* Pending */
.stat-card:has(#pendingBookings) {
    background: #fef3c7 !important;
    border: 2px solid #f59e0b !important;
}

/* Confirmed */
.stat-card:has(#confirmedBookings) {
    background: #dcfce7 !important;
    border: 2px solid #22c55e !important;
}

/* Completed */
.stat-card:has(#completedBookings) {
    background: #dbeafe !important;
    border: 2px solid #3b82f6 !important;
}

/* Cancelled */
.stat-card:has(#cancelledBookings) {
    background: #fee2e2 !important;
    border: 2px solid #ef4444 !important;
}


/* Number colors */

.stat-card:has(#totalBookings) .stat-number {
    color: #0369a1 !important;
}

.stat-card:has(#pendingBookings) .stat-number {
    color: #b45309 !important;
}

.stat-card:has(#confirmedBookings) .stat-number {
    color: #15803d !important;
}

.stat-card:has(#completedBookings) .stat-number {
    color: #1d4ed8 !important;
}

.stat-card:has(#cancelledBookings) .stat-number {
    color: #dc2626 !important;
}
/* =========================================
   BOOKING ACTION BUTTON COLORS
========================================= */

.booking-actions button {
    border: none;
    color: white;
    font-weight: bold;
    padding: 10px 16px;
    border-radius: 7px;
    cursor: pointer;
    transition: 0.2s ease;
}

/* Confirm - Green */
.booking-actions button:nth-child(1) {
    background: #16a34a;
}

/* Complete - Blue */
.booking-actions button:nth-child(2) {
    background: #2563eb;
}

/* Cancel - Orange */
.booking-actions button:nth-child(3) {
    background: #ea580c;
}

/* Delete - Red */
.booking-actions button:nth-child(4) {
    background: #dc2626;
}

/* Hover effect */
.booking-actions button:hover {
    opacity: 0.85;
    transform: translateY(-1px);
}
/* =========================================
   SEARCH & FILTER
========================================= */

.booking-filters {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
    background: white;
    padding: 18px;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
}

.booking-filters input,
.booking-filters select {
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    font-size: 15px;
    outline: none;
    background: white;
}

.booking-filters input {
    flex: 1;
}

.booking-filters input:focus,
.booking-filters select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
}

.booking-filters select {
    min-width: 180px;
    cursor: pointer;
}


/* Mobile */

@media (max-width: 600px) {

    .booking-filters {
        flex-direction: column;
    }

    .booking-filters input,
    .booking-filters select {
        width: 100%;
    }

}
/* =========================================
   BOOKING META INFORMATION
========================================= */

.booking-meta {
    font-size: 13px !important;
    color: #6b7280 !important;
    margin: 5px 0 !important;
}

.booking-meta strong {
    color: #374151;
}

.booking-meta:first-of-type {
    margin-top: -10px !important;
}

.booking-meta:nth-of-type(2) {
    margin-bottom: 18px !important;
}

.copy-id-button {
    padding: 5px 9px;
    margin-left: 8px;
    margin-bottom: 0;
    background: #374151;
    color: white;
    font-size: 11px;
    border-radius: 5px;
}

.copy-id-button:hover {
    background: #111827;
}

/* =========================================
   PAGE TITLE + REFRESH BUTTON
========================================= */

.page-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.refresh-button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin: 0;
    transition: 0.2s ease;
}

.refresh-button:hover {
    background: #1d4ed8;
    opacity: 1;
}

.refresh-button:active {
    transform: scale(0.97);
}


/* Mobile */

@media (max-width: 600px) {

    .page-title-row {
        flex-direction: column;
        align-items: stretch;
    }

    .refresh-button {
        width: 100%;
    }

}

    </style>

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================= -->

    <header class="admin-header">

        <h1>
            Riviera Transfers
        </h1>

        <p>
            Admin Dashboard
        </p>

    </header>


    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="admin-container">


        <!-- PAGE TITLE -->

       <div class="page-title">

    <div class="page-title-row">

        <div>
            <h2>Bookings</h2>

            <p>
                Manage all transfer bookings from here.
            </p>
            <p class="last-updated">
    Last updated: <span id="lastUpdated">Never</span>
</p>
        </div>

        <button
            type="button"
            class="refresh-button"
            onclick="loadBookings()"
        >
            🔄 Refresh Bookings
        </button>

    </div>

</div>


        <!-- =====================================
             DASHBOARD STATISTICS
        ====================================== -->

        <div class="dashboard-stats">


            <div class="stat-card">

                <h3>
                    Total Bookings
                </h3>

                <div
                    class="stat-number"
                    id="totalBookings"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Pending
                </h3>

                <div
                    class="stat-number"
                    id="pendingBookings"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Confirmed
                </h3>

                <div
                    class="stat-number"
                    id="confirmedBookings"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Completed
                </h3>

                <div
                    class="stat-number"
                    id="completedBookings"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Cancelled
                </h3>

                <div
                    class="stat-number"
                    id="cancelledBookings"
                >
                    0
                </div>

            </div>


        </div>


        <!-- =====================================
             BOOKINGS LIST
        ====================================== -->
       
        <!-- =========================
     SEARCH & FILTER
========================= -->

<div class="booking-filters">

    <input
        type="text"
        id="bookingSearch"
        placeholder="Search by name or phone..."
    >

    <select id="statusFilter">

        <option value="all">
            All Bookings
        </option>

        <option value="pending">
            Pending
        </option>

        <option value="confirmed">
            Confirmed
        </option>

        <option value="completed">
            Completed
        </option>

        <option value="cancelled">
            Cancelled
        </option>

    </select>

</div>

        <div id="bookings">

            Loading bookings...

        </div>


    </main>


    <!-- =========================================
         EXTERNAL JAVASCRIPT
    ========================================= -->

    <script src="/admin/js/script.js"></script>


</body>

</html>
