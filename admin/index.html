<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Riviera Transfers - Admin</title>

    <link rel="stylesheet" href="/admin/css/styles.css">

</head>


<body>

    <!-- =========================================
         HEADER
    ========================================= -->

    <header class="admin-header">

        <h1>Riviera Transfers</h1>

        <p>Admin Dashboard</p>

    </header>


    <!-- =========================================
         MAIN CONTAINER
    ========================================= -->

    <main class="admin-container">


        <!-- =====================================
             PAGE TITLE
        ====================================== -->

        <div class="page-title">

            <div class="page-title-row">

                <div>

                    <h2>Bookings</h2>

                    <p>
                        Manage all transfer bookings from here.
                    </p>

                    <p class="last-updated">
                        Last updated:
                        <span id="lastUpdated">
                            Never
                        </span>
                    </p>

                </div>


                <button
                    type="button"
                    class="refresh-button"
                    onclick="loadBookings()"
                >
                    🔄 Refresh Bookings
                </button>

            </div>

        </div>


        <!-- =====================================
             DASHBOARD STATISTICS
        ====================================== -->

        <div class="dashboard-stats">


            <div class="stat-card">

                <h3>Total Bookings</h3>

                <div
                    class="stat-number"
                    id="totalBookings"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>Pending</h3>

                <div
                    class="stat-number"
                    id="pendingBookings"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>Confirmed</h3>

                <div
                    class="stat-number"
                    id="confirmedBookings"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>Completed</h3>

                <div
                    class="stat-number"
                    id="completedBookings"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>Cancelled</h3>

                <div
                    class="stat-number"
                    id="cancelledBookings"
                >
                    0
                </div>

            </div>


        </div>


        <!-- =====================================
             SEARCH AND FILTER
        ====================================== -->

        <div class="booking-filters">

            <input
                type="text"
                id="bookingSearch"
                placeholder="Search by name or phone..."
                autocomplete="off"
            >


            <select id="statusFilter">

                <option value="all">
                    All Bookings
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="confirmed">
                    Confirmed
                </option>

                <option value="completed">
                    Completed
                </option>

                <option value="cancelled">
                    Cancelled
                </option>

            </select>

        </div>


        <!-- =====================================
             BOOKINGS
        ====================================== -->

        <div id="bookings">

            Loading bookings...

        </div>


    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script src="js/script.js"></script>

</body>

</html>
